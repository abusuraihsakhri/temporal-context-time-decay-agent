name: Temporal Context Time Decay Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Compile Python modules
      run: python -m compileall -q agents temporal_decay cli.py simulator.py enrichment.py

    - name: Validate browser JavaScript syntax
      run: |
        python - <<'PY'
        import re
        from pathlib import Path
        html = Path("web/index.html").read_text(encoding="utf-8")
        script = re.search(r"<script>(.*?)</script>", html, re.S)
        assert script, "Browser application script missing"
        Path("/tmp/temporal-decay-ui.js").write_text(script.group(1), encoding="utf-8")
        PY
        node --check /tmp/temporal-decay-ui.js

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
