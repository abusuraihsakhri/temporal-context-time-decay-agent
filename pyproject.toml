[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-context-time-decay-engine"
version = "2.0.0"
description = "TemporalDecay: Time-Weighted Memory Salience & Exponential Forgetting Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
temporal-context-time-decay-engine = "temporal_decay.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/temporal-context-time-decay-engine"
Repository = "https://github.com/abusuraihsakhri/temporal-context-time-decay-engine.git"
